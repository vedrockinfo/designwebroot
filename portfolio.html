<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="language" content="English">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="alternate" hreflang="en" href="https://designwebroot.in/" />
    <link rel="alternate" hreflang="x-default" href="https://designwebroot.in/" />
    <title>Portfolio | Design Web Root</title>
    <link rel="shortcut icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.min.css">
    <!-- Menu Script -->
    <script src="assets/js/myMenu.js"></script>
</head>

<body>
    <script>mainHeader()</script>
    <main>
        <section class="innerSection">
        </section>
        <section class="mainService mTop">
            <div class="container">
                <div class="sectionTitle">
                    <h6 class="subHeading">Portfolio</h6>
                    <h2 class="headingPrimary">Featured <span>Projects</span></h2>
                    <p class="headPara">Explore my recent work across different industries and project types.</p>
                </div>
            </div>
        </section>

        <section class="myPortfolio mTop">
            <div class="container">
                <div class="portfolioGrid">
                    <div class="portfolioGrid__Item">
                        <input type="radio" name="myProjects" id="all" value="all" checked>
                        <label for="all">all</label>
                    </div>
                    <div class="portfolioGrid__Item">
                        <input type="radio" name="myProjects" id="school" value="school">
                        <label for="school">school</label>
                    </div>
                    <div class="portfolioGrid__Item">
                        <input type="radio" name="myProjects" id="event" value="event">
                        <label for="event">event</label>
                    </div>
                    <div class="portfolioGrid__Item">
                        <input type="radio" name="myProjects" id="wordpress" value="wordpress">
                        <label for="wordpress">wordpress</label>
                    </div>
                    <div class="portfolioGrid__Item">
                        <input type="radio" name="myProjects" id="react" value="react">
                        <label for="react">react</label>
                    </div>
                </div>
                <div class="projectGrid">
                    <div class="projectGrid__Item" data-target="school">1</div>
                    <div class="projectGrid__Item" data-target="school">2</div>
                    <div class="projectGrid__Item" data-target="school">3</div>
                    <div class="projectGrid__Item" data-target="school">4</div>
                    <div class="projectGrid__Item" data-target="school">5</div>
                    <div class="projectGrid__Item" data-target="event">6</div>
                    <div class="projectGrid__Item" data-target="event">7</div>
                    <div class="projectGrid__Item" data-target="event">8</div>
                    <div class="projectGrid__Item" data-target="event">9</div>
                    <div class="projectGrid__Item" data-target="wordpress">10</div>
                    <div class="projectGrid__Item" data-target="wordpress">11</div>
                    <div class="projectGrid__Item" data-target="wordpress">12</div>
                    <div class="projectGrid__Item" data-target="wordpress">13</div>
                    <div class="projectGrid__Item" data-target="wordpress">14</div>
                    <div class="projectGrid__Item" data-target="react">15</div>
                    <div class="projectGrid__Item" data-target="react">16</div>
                    <div class="projectGrid__Item" data-target="react">17</div>
                    <div class="projectGrid__Item" data-target="react">18</div>
                </div>
            </div>
        </section>
    </main>
    <script>mainFooter()</script>

    <script src="assets/js/main.js"></script>
</body>

</html>
